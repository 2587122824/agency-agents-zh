name: V2 CI

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'

jobs:
  backend:
    name: V2 backend contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: v2/backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r v2/backend/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q v2/backend

      - name: Run backend contract tests
        run: python -m pytest -q v2/backend/tests

  frontend:
    name: V2 frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build
